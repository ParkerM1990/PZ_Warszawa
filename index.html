header{

}
.sidebar{

  bottom:0;
  width:72px;
  background:#020617;
  border-right:1px solid #1f2937;
  display:flex;
  flex-direction:column;

  z-index:2500;

.nav-btn{

  height:56px;

  border-radius:14px;
  background:transparent;
  color:#e5e7eb;
  font-size:20px;
  cursor:pointer;
  transition:0.2s;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.nav-btn span{
  display:none;
}

.nav-btn:hover{
  background:#111827;
}

.nav-btn.active{
  background:#1d4ed8;
}

/* MOBILE */

@media(max-width:768px){

.main{

  bottom:0;

.filter-toggle{

  padding:8px 10px;

}

.map-filter-panel{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:#020617;
  border:1px solid #1f2937;
  border-radius:12px;
  padding:10px;
  display:grid;
  gap:10px;

  max-height:0;
  overflow:hidden;
  opacity:0;
  transform:translateY(-10px);
  transition:0.3s ease;
  z-index:1000;
}

/* ✅ stan otwarty */
.map-filter-panel.open{
  max-height:200px;
  opacity:1;
  transform:translateY(0)
}

  top:0;
  left:0;
  right:0;
  bottom:0;

  position:sticky;
  top:0;
  z-index:10;

.map-filter-wrapper{

.filter-item span{

.filter-item input{

function renderAdminPanel(){

  const structBox = document.getElementById("structuresBox");

  // ✅ budujemy mapę: structure -> nodes
  const map = {};

  Object.values(allParkomaty).forEach(p => {

    if(!map[p.structure]){
      map[p.structure] = new Set();
    }

    if(p.node){
      map[p.structure].add(p.node);
    }
  });

  // ✅ budowanie HTML
  structBox.innerHTML = Object.keys(map).sort().map(struct => {

    const nodes = [...map[struct]].sort();

    return `
      <div style="
        border:1px solid #1f2937;
        border-radius:10px;
        padding:10px;
        margin-bottom:8px;
      ">

        <label style="font-weight:bold;">
          <input type="checkbox" value="${struct}" class="structCheck">
          ${struct}
        </label>

        <div style="margin-left:15px;margin-top:6px;display:grid;gap:4px;">
          ${nodes.map(n => `
            <label>
              <input type="checkbox" value="${n}" class="nodeCheck" data-struct="${struct}">
              ${n}
            </label>
          `).join("")}
        </div>

      </div>
    `;
  }).join("");
}
  document.addEventListener("change", (e) => {

  // ✅ klik na strukturę
  if(e.target.classList.contains("structCheck")){

    const struct = e.target.value;
    const checked = e.target.checked;

    document
      .querySelectorAll(`.nodeCheck[data-struct="${struct}"]`)
      .forEach(cb => cb.checked = checked);
  }
});

function getNavLink(lat, lng){

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(isIOS){
    return `maps://?daddr=${lat},${lng}`; // ✅ Apple Maps (pewne)
  }

  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`; // ✅ stabilne na PC
}

/* ===== CSV ===== */
function parseCSV(text){
  const rows=[];
  const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/);
  for(let line of lines){
    if(!line.trim()) continue;
    rows.push(line.split(",").map(v=>v.replace(/^"|"$/g,"")));
  }
  return rows;
}


let actionDict = {}; // ✅ dodaj nad funkcją (globalnie)

async function loadServiceActions(){

/* ===== LOAD PARKOMATY ===== */
async function loadParkomaty(){

  const rows = await (await fetch("parkomaty.json")).json();

  const nodeSet = new Set();

  rows.forEach(r => {

    const id = r.id?.trim();
    const lat = parseFloat(r.lat);
    const lng = parseFloat(r.lng);
    const structure = (r.structure || "").replace(/\r/g, "").trim();
    const node = (r.node || "").replace(/\r/g, "").trim();

    if(!id || !structure || isNaN(lat) || isNaN(lng)) return;

    const key = makeKey(id, structure);

    allParkomaty[key] = {
      id,
      structure,
      lat,
      lng,
      location: r.location,
      node
    };

    nodeSet.add(node);
  });

  const nodes = [...nodeSet].sort();

  const options =
    `<option value="">Wszystkie strefy</option>` +
    nodes.map(n => `<option value="${n}">${n}</option>`).join('');

  document.getElementById("nodeFilter").innerHTML = options;

  document.getElementById("activeNodeFilter").innerHTML = options;
  document.getElementById("historyNodeFilter").innerHTML = options;
  document.getElementById("deviceNodeFilter").innerHTML = options;
}

  const structuresSet = new Set();

  });

  availableStructures = [...structuresSet].sort();
  availableNodes = [...nodesSet].sort();

  console.log("✅ STRUKTURY:", availableStructures);
  console.log("✅ MIASTA:", availableNodes);
}

function renderMarkers(){

  const node=document.getElementById("nodeFilter").value;
  markerLayer.clearLayers();

  let points=[];

 

Object.keys(activeEvents).forEach(key => {

  const p = allParkomaty[key];
  if(!p) return;

  if(node && p.node!==node) return;

  let popup = `<b>Parkomat ${p.id}</b><br>${p.location}<br><br>`;

  

activeEvents[key].forEach(e=>{
  popup+=`
    • <b>${e.hardware || "Inne"}</b> – ${e.name}<br>
    <small>${e.date}</small><br>
  `;

  });

  popup+=`
    <br>
    <a href="${getNavLink(p.lat,p.lng)}"
       target="_blank"
       style="background:#16a34a;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;">
       🧭 Nawiguj
    </a>
  `;

  // ✅ 👉 DODAJ TO TU
  const codes = activeEvents[key].map(e => (e.code ? String(e.code).trim() : ""));
  const hasCritical = codes.some(code => RED_CODES.includes(code));

  // ✅ marker
  const icon = L.divIcon({
    className: '',
    html: `
      <div style="
        width:22px;
        height:22px;
        border-radius:50%;
        background:${hasCritical ? '#dc2626' : '#16a34a'};
        border:2px solid white;
        box-shadow:0 0 8px rgba(0,0,0,0.6);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:12px;
        color:white;
        font-weight:bold;
      ">
        ${activeEvents[key].length}
      </div>
    `
  });

  L.marker([p.lat,p.lng], { icon })
    .bindPopup(popup)
    .addTo(markerLayer);

  points.push([p.lat,p.lng]);
});


  if(points.length===0){
    map.setView([52.2297,21.0122],6);
  }
  else if(points.length===1){
    map.setView(points[0],15);
  }
  else{
    map.fitBounds(L.latLngBounds(points),{
      padding:[50,50],
      maxZoom:16
    });
  }
}

/* ===== AWARIE ===== */
function renderActiveList(){

  const node = document.getElementById("activeNodeFilter").value;
  const from = document.getElementById("activeDateFrom").value;
  const to = document.getElementById("activeDateTo").value;
  const terminal = document.getElementById("activeTerminalFilter").value.trim();
  const event = document.getElementById("activeEventFilter").value;

  let html = "";

  Object.keys(activeEvents).forEach(key => {

    const p = allParkomaty[key];
    if(!p) return;

    const id = p.id;

    const filtered = activeEvents[key].filter(e => {

      // ✅ bezpieczne parsowanie daty
      const raw = e.date;
      if(!raw) return false;

      const d = new Date(raw.replace(" ", "T"));

      // ✅ filtr OD
      if(from && d < new Date(from)) return false;

      // ✅ filtr DO (cały dzień!)
      if(to){
        const toDate = new Date(to);
        toDate.setHours(23,59,59,999);
        if(d > toDate) return false;
      }

      // ✅ filtr po numerze
      if(terminal && !id.includes(terminal)) return false;

      // ✅ filtr po typie zdarzenia
      if(event && e.name !== event) return false;

      // ✅ filtr po strefie
      if(node && p.node !== node) return false;

      return true;
    });

    if(filtered.length === 0) return;

    html += `
      <div class="terminal-box">
        <b>Parkomat ${id}</b><br>
        ${p.location}<br><br>
    `;

    
filtered.forEach(e => {
  html += `
    • <b>${e.hardware || "Inne"}</b> – ${e.name}<br>
    <small>${e.date}</small><br>

    <button onclick="openServiceModal('${key}', ${JSON.stringify(e).replace(/"/g,'&quot;')})"
      style="
        margin-top:6px;
        background:#2563eb;
        color:white;
        border:none;
        padding:5px 8px;
        border-radius:6px;
      ">
      🔧 Usuń awarię
    </button>

    <br><br>
  `;
});

// ✅ ZAMKNIĘCIE BOXA
html += `</div>`;
});

  document.getElementById("awarieList").innerHTML = html;
}

  function renderInterwencje(){

const terminalFilter = document.getElementById("interTerminalFilter")?.value.toLowerCase().trim() || "";
const userFilter = document.getElementById("interUserFilter")?.value.toLowerCase() || "";
const typeFilter = document.getElementById("interTypeFilter")?.value || "";

  let html = "";
  let count = 0;   // ✅ licznik
  interwencje.forEach(r => {

    const id = r[0];        // ID parkomatu
    const structure = r[1]; // struktura
    const location = r[2];  // adres
    const event = r[3];     // nazwa zdarzenia
    const start = r[4];
    const end = r[5];
    const userRaw = r[6] || "";
    const user = userRaw.toLowerCase();


// ✅ filtr po ID
if(terminalFilter && !id.toLowerCase().includes(terminalFilter)) return;

// ✅ filtr po pracowniku
if(userFilter && !user.includes(userFilter)) return;

    
const grouped = {
  hardware: [],
  software: [],
  serwis: [],
  inne: []
};

r.slice(7).forEach(a => {
  if(!a || !a.trim()) return;

  const clean = a.trim();

  // ✅ pobieramy typ z Twojego słownika ACTIONS_URL
  

const key = clean.trim();
const type = actionDict[key]
  || actionDict[key.toLowerCase()]
  || "inne";

  if(grouped[type]){
    grouped[type].push(clean);
  }else{
    grouped.inne.push(clean);
  }
});
// ✅ filtr po typie
    if(typeFilter){  const hasType = grouped[typeFilter] && grouped[typeFilter].length > 0;  if(!hasType) return;}
// ✅ 🔥 LICZNIK – TUTAJ
    count++;
    html += `
      <div class="terminal-box">

        <b>Parkomat ${id}</b><br>
        ${location}<br><br>

        ⚠️ ${event}<br>
        👤 ${userRaw}<br>
        🔧<br>

${grouped.hardware.length ? `
<b>💻 Hardware</b><br>
${grouped.hardware.map(a => `• ${a}`).join("<br>")}<br><br>
` : ""}

${grouped.software.length ? `
<b>⚙️ Software</b><br>
${grouped.software.map(a => `• ${a}`).join("<br>")}<br><br>
` : ""}

${grouped.serwis.length ? `
<b>🔧 Serwis</b><br>
${grouped.serwis.map(a => `• ${a}`).join("<br>")}<br><br>
` : ""}

${grouped.inne.length ? `
<b>📦 Inne</b><br>
${grouped.inne.map(a => `• ${a}`).join("<br>")}
` : ""}

        <small>
          ⏱ ${start} → ${end}
        </small>

      </div>
    `;
  });

  if(!html){

    <div style="text-align:center;margin-top:40px;color:#9ca3af;">

document.getElementById("interwencjeList").innerHTML = `

`;

  function renderInterStats(){

  
const from = document.getElementById("statsFrom")?.value;
const to = document.getElementById("statsTo")?.value;


  const statsUsers = {};
  const statsParts = {};

  interwencje.forEach(r => {

   
const start = r[4];
if(!start) return;

const d = new Date(start.replace(" ", "T"));

if(from && d < new Date(from)) return;

if(to){
  const toDate = new Date(to);
  toDate.setHours(23,59,59,999);
  if(d > toDate) return;
}


    const user = r[6] || "Nieznany";

    if(!statsUsers[user]){
      statsUsers[user] = {
        total: 0,
        hardware: 0,
        software: 0,
        serwis: 0
      };
    }

    const grouped = {
      hardware: [],
      software: [],
      serwis: []
    };

    r.slice(7).forEach(a => {
      if(!a || !a.trim()) return;

      const clean = a.trim();

      const type = actionDict[clean]
        || actionDict[clean.toLowerCase()]
        || "inne";

      if(grouped[type]){
        grouped[type].push(clean);
      }

      // ✅ liczenie części
      statsParts[clean] = (statsParts[clean] || 0) + 1;
    });

    statsUsers[user].total++;

    if(grouped.hardware.length) statsUsers[user].hardware++;
    if(grouped.software.length) statsUsers[user].software++;
    if(grouped.serwis.length) statsUsers[user].serwis++;

  });

  let html = `<div style="padding:10px;">`;

  
let label = "(wszystko)";
if(from || to){
  label = `${from || "..."} → ${to || "..."}`;
}

html += `<h3>📊 Statystyki ${label}</h3>`;


  html += `<h3>👷 Pracownicy</h3>`;

  Object.entries(statsUsers)
    .sort((a,b) => b[1].total - a[1].total)
    .forEach(([user, s]) => {

      html += `
        <div class="terminal-box">
          <b>${user}</b><br>
          🔎 ${s.total}<br>
          💻 ${s.hardware} | ⚙️ ${s.software} | 🔧 ${s.serwis}
        </div>
      `;
    });

  html += `<h3>🔩 Podzespoły</h3>`;

  Object.entries(statsParts)
    .sort((a,b) => b[1] - a[1])
    .forEach(([part, count]) => {

      html += `
        <div class="terminal-box">
          ${part}<br>
          🧮 ${count} szt.
        </div>
      `;
    });

  html += `</div>`;

  document.getElementById("interwencjeList").innerHTML = html;
}


  /* ===== STATYSTYKI ===== */
function showStats(){

  const totalDevices = Object.keys(allParkomaty).length;

  const devicesWithAlarms = Object.keys(activeEvents).length;

  let totalAlarms = 0;
  Object.values(activeEvents).forEach(arr=>{
    totalAlarms += arr.length;
  });

  alert(
`📊 STATYSTYKI

🖥️ Urządzenia: ${totalDevices}

⚠️ Parkomaty z awarią: ${devicesWithAlarms}

🔥 Wszystkie awarie: ${totalAlarms}`
  );
}

/* ===== MASTER ===== */
function renderAll(){
  renderMarkers();
  renderActiveList();
  renderHistoryList();
  renderDevicesList();
}

/* ===== INIT (FAST) ===== */
async function init(){

  // ✅ NAJWAŻNIEJSZE NA START
  await loadParkomaty();
  buildStructuresAndNodes();
  await loadActive();

  // ✅ szybki widok
  populateActiveEventFilter();
  renderMarkers();
  renderActiveList();

  // ✅ NIE BLOKUJ UI ↓↓↓
  loadHistory().then(() => {
    populateEventFilter();
    renderHistoryList();
  });

  await loadServiceActions();
  loadTechnicians();
await loadInterwencje();
  renderInterwencje();
  setTimeout(() => {
    renderDevicesList();
  }, 100);
  checkAuth();
  renderAdminPanel();
}

init();


// zamykanie po wyborze

setTimeout(()=>{
  const nodeFilter = document.getElementById("nodeFilter");

  if(nodeFilter){
    nodeFilter.addEventListener("change", ()=>{
      document.getElementById("mapFilterPanel").classList.remove("open");
    });
  }
}, 0);


// zamykanie po kliknięciu poza panel

document.addEventListener("click", (e)=>{
  const panel = document.getElementById("mapFilterPanel");
  const button = document.querySelector(".filter-toggle");

  if (!panel || !button) return;

  if (!panel.contains(e.target) && !button.contains(e.target)) {
    panel.classList.remove("open");
  }
});


</script>
